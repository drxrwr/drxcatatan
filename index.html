<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengingat Bayar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  Catatan tambahan
  <div class="header-right">
    <span class="icon-btn" onclick="toggleMenu()">☰</span>
  </div>
</header>

<input class="search" placeholder="Cari username..." oninput="search(this.value)">

<div class="container" id="list"></div>

<button class="fab" onclick="openAdd()">+</button>

<div class="menu" id="menu">
  <button onclick="setSort('new')">Terbaru</button>
  <button onclick="setSort('old')">Terlama</button>
  <button onclick="setColor('green')">Hijau (0–2)</button>
  <button onclick="setColor('lblue')">Biru Muda (3–6)</button>
  <button onclick="setColor('dblue')">Biru Tua (7–15)</button>
  <button onclick="setColor('purple')">Ungu (16–30)</button>
  <button onclick="setColor('red')">Merah (31+)</button>
  <button onclick="setColor('all')">Semua</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">Tambah</h3>
    <input id="username" placeholder="@username telegram">
    <input id="amount" placeholder="Nominal">
    <textarea id="note" placeholder="Catatan"></textarea>
    <button onclick="save()">✔ Simpan</button>
    <button class="danger" id="deleteBtn" onclick="remove()" style="display:none">🗑 Hapus</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
